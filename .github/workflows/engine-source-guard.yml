name: Engine Source Guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject engine source in working tree and Git history
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./tools/check-engine-source.ps1 -IncludeHistory -FailOnFind
